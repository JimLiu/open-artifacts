# dsh-claude-data bundle patch: installing the package (the Plugins page, or
# `dsh plugin --profile <name> add <spec>`) adds it to the profile's bundles,
# and this layer mounts two rows. claude-data registers the skill with the
# profile's skill registry, for every preset; to give it to one preset, turn this
# row off and declare dsh-claude-data among that preset's plugins. claude-artifacts-data
# is dsh-claude-artifacts, what the open-artifacts plugins share (the Artifacts page, comments
# reaching the agent). It stays on whichever that is. Each plugin mounts it under its own id, so
# that the plugin can be removed while another one is installed; one of the rows does the work.
- insert:
    - id: claude-artifacts-data
      name: dsh-claude-artifacts
    - id: claude-data
      name: dsh-claude-data
